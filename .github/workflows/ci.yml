name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # `postgenerate` writes _headers (CSP hashes) and fails on external URLs.
      - run: npm run generate
      - name: Shell size budget (≤180 KB gzip for the entry chunk + CSS of /)
        run: |
          total=0
          for f in $(grep -oE '/_nuxt/[^"]+\.(js|css)' .output/public/index.html | sort -u); do
            size=$(gzip -c ".output/public$f" | wc -c); total=$((total + size))
          done
          echo "Initial JS+CSS (gzip): $total bytes"
          test "$total" -le 184320
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
